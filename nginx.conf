server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = / {
        default_type text/plain;
        return 200 "OhRats assets\n";
    }

    location /latest/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
}
