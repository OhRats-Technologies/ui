server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = / {
        default_type text/plain;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        return 200 "OhRats assets\n";
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @asset_not_found;
        try_files $uri =404;
    }

    location /v1/ {
        add_header Access-Control-Allow-Origin "*" always;
        # Short-TTL rolling channel so updates in OhRats-Technologies/ui propagate
        # automatically across every product without manual hash bumps.
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=300, stale-while-revalidate=60";
        error_page 404 = @asset_not_found;
        try_files $uri =404;
    }

    location @asset_not_found {
        internal;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        return 404;
    }
}
