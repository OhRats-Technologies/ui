server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = / {
        default_type text/plain;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        return 200 "OhRats assets\n";
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        # Only successful fingerprinted assets are immutable. Do not attach
        # long-lived cache headers to 404s for assets that have not deployed yet.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

}
