server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = / {
        default_type text/plain;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        return 200 "OhRats assets\n";
    }

    include /etc/nginx/asset-redirects.conf;

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(current|latest)/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=300, must-revalidate" always;
        return 404;
    }
}
